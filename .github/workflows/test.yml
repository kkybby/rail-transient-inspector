name: Software tests and demo build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rti-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned vendored parser
        run: python3 tools/fetch_vendor.py
      - name: Run Node tests
        run: |
          set -o pipefail
          npm test | tee docs/node-test-run.txt
      - name: Build reproducible offline demo and synthetic reports
        run: python3 tools/build_demo.py
      - name: Install optional browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Chromium smoke checks and actual application screenshots
        env:
          RTI_ARTIFACT_DIR: assets
        run: |
          set -o pipefail
          python3 tests/browser_smoke.py | tee docs/browser-smoke-run.txt
          rm -f assets/report.json
      - name: Record checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          files = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and '__pycache__' not in p.parts and p.name != 'SHA256SUMS')
          Path('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.as_posix() + '\n' for p in files), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-generated-files
          retention-days: 14
          path: |
            standalone.html
            vendor/papaparse.min.js
            samples/
            assets/app-screenshot.png
            assets/mobile-screenshot.png
            docs/node-test-run.txt
            docs/browser-smoke-run.txt
            SHA256SUMS
  publish-generated-files:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kkybby/rail-transient-inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-generated-files
          path: .
      - name: Commit only generated demo files, with no force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- standalone.html vendor/papaparse.min.js samples assets/app-screenshot.png assets/mobile-screenshot.png docs/node-test-run.txt docs/browser-smoke-run.txt SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build offline demo and synthetic validation assets [skip ci]'
          git push origin HEAD:main
